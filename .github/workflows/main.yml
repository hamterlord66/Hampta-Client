name: Compile Eaglercraft 1.8 WASM Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Scripts Executable
        run: |
          chmod +x gradlew || true
          chmod +x target_teavm_wasm_gc/MakeWASMClientBundle.sh || true

      - name: Build WASM Client
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew makeMainWasmClientBundle || ./gradlew build
          fi
          if [ -f "target_teavm_wasm_gc/MakeWASMClientBundle.sh" ]; then
            cd target_teavm_wasm_gc && ./MakeWASMClientBundle.sh && cd ..
          fi

      - name: Upload WASM Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft_1.8_WASM_Client
          path: |
            javascript_dist/**
            target_teavm_wasm_gc/**
            javascript/**
            build/libs/**
            *.html
            *.wasm
            *.epw
            *.js
